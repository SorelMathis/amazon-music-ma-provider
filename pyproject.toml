[project]
name = "amazon-music-ma-provider"
version = "0.1.0"
description = "Independent Amazon Music provider scaffold for Music Assistant development."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SorelMathis" }]
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.9.0",
  "keyring>=24.0.0",
  "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
